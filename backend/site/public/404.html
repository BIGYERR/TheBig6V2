<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Not found · Iron Asylum</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Served by server/app.ts for any page that does not exist. Self contained: no script, no bundle. -->
  <style>
    :root { --bg: #f4f1e8; --text: #181712; --muted: #6b6557; --on-ink: #f4f1e8; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--text); text-align: center;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;
    }
    .code {
      margin: 0; font-weight: 900; font-size: clamp(120px, 30vw, 300px); line-height: 0.8; letter-spacing: -0.06em;
      color: transparent; -webkit-text-stroke: 2px var(--text);
    }
    h1 { margin: 28px 0 10px; font-size: clamp(32px, 6vw, 56px); font-weight: 900; letter-spacing: -0.04em; text-transform: uppercase; }
    p { margin: 0 0 32px; color: var(--muted); font-size: 18px; }
    a {
      display: inline-flex; align-items: center; height: 52px; padding: 0 24px; border-radius: 4px;
      background: var(--text); color: var(--on-ink); font-weight: 700; font-size: 13px; letter-spacing: 0.08em;
      text-transform: uppercase; text-decoration: none;
    }
    a:hover { background: #2d2b23; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Wrong turn.</h1>
    <p>This page does not exist. The rest of the asylum does.</p>
    <a href="/">Back to the site</a>
  </main>
</body>
</html>
