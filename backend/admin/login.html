<main class="login">
  <div class="login-card">
    <a class="brand" href="/" aria-label="Iron Asylum website">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-word">THE <b>ASYLUM</b></span>
    </a>
    <h1>Staff login</h1>

    @if (state.auth() === 'off') {
      <p class="login-note" role="status">{{ state.notice() }}</p>
    } @else {
      @if (state.notice()) {
        <p class="login-note" role="status">{{ state.notice() }}</p>
      }
      <form (submit)="submit($event)" novalidate>
        <label for="login-user">Username</label>
        <input id="login-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required [value]="user()" (input)="field('user', $event)" />
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required [value]="password()" (input)="field('password', $event)" />
        @if (error()) {
          <p class="login-error" role="alert">{{ error() }}</p>
        }
        <button type="submit" class="primary" [disabled]="busy() || !user() || !password()">{{ busy() ? 'Signing in…' : 'Sign in' }}</button>
      </form>
    }
    <a class="login-back" href="/">Back to the website</a>
  </div>
</main>
