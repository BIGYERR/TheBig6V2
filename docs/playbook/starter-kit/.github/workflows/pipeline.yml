# The pipeline. main is production: Heroku deploys every push to main by itself (automatic deploys from GitHub). Work is
# committed on dev and pushed there; every push to dev runs every check below, and nothing waits for it. __OWNER_NAME__
# reads the run, then opens a pull request from dev into main by hand to release (no agent ever opens one). Branch
# protection lets main change only through that pull request, and only when every check passes on it.
#
#   push to dev                every check. A newer push cancels the running one.
#   pull request dev -> main   the same checks again, plus "PR source is dev". All must pass to merge.
#   push to main (the merge)   the deploy proof: Heroku serves the merged commit (its /healthz reports it).
#   workflow_dispatch          run the checks by hand on any branch.
#
# The checks main requires are these jobs' names, kept in GitHub's branch protection settings, not in this file: a
# renamed job is renamed there too. Every job keeps temp/ (the run's logs) as an artifact.
name: pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # One Node line everywhere: the engines fields and the Dockerfiles say the same (backend/test/platform.test.ts).
  NODE_VERSION: '26'

jobs:
  source:
    name: PR source is dev
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Only dev merges into main
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$HEAD" != "dev" ]; then
            echo "::error::A pull request into main must come from dev; this one comes from '$HEAD'. Merge it into dev first."
            exit 1
          fi
          echo "from dev: ok"

  backend:
    name: backend
    if: github.event_name != 'push' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-run-log
          path: temp/
          if-no-files-found: ignore
          retention-days: 30

  heroku-build:
    name: Heroku build
    if: github.event_name != 'push' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build what Heroku would (the root package.json, then the Procfile's web process), and read / and /healthz back
        run: bash backend/scripts/heroku.sh local --check --online

  docker:
    name: docker
    if: github.event_name != 'push' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      API_PORT: '3000'
      GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image and wait for its health check
        run: docker compose up --build -d --wait
      - name: /healthz reports this commit
        run: |
          got="$(curl -fsS "http://127.0.0.1:$API_PORT/healthz" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).commit))')"
          if [ "$got" != "$GITHUB_SHA" ]; then echo "::error::/healthz reports '$got', wanted $GITHUB_SHA"; exit 1; fi
          echo "the image serves $GITHUB_SHA"
      - name: Container logs
        if: always()
        run: docker compose logs --no-color api || true
      - name: Stop it
        if: always()
        run: docker compose down

  deployed:
    name: deploy proof (Heroku)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Heroku serves the merged commit (passes with a notice while the HEROKU_URL variable is unset)
        env:
          HEROKU_URL: ${{ vars.HEROKU_URL }}
        run: node tools/deploy-check.mjs --commit "$GITHUB_SHA"
