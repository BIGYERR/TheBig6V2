server {
  listen 80;
  root /usr/share/nginx/html;

  # Never let a cached copy stand in for the build under test.
  add_header Cache-Control "no-store" always;

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # The original single-file app, served beside the Angular build as the comparison reference.
  location /reference/ {
    alias /srv/reference/;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
