<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>sheet focus</title>
<style>
/* the app's own sheet rules, css/detail-sheet.css and css/motion.css */
html,body{margin:0;font:16px -apple-system;touch-action:manipulation}
.overlay{display:none;position:fixed;inset:0;background:#F3F3F1;z-index:200;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.overlay.open{display:block;}
.overlay{display:block !important;transform:translateY(100%);visibility:hidden;will-change:transform;pointer-events:none;
  transition:transform .36s cubic-bezier(.32,.72,0,1), visibility 0s linear .36s;}
.overlay.open{transform:translateY(0);visibility:visible;pointer-events:auto;
  transition:transform .40s cubic-bezier(.32,.72,0,1), visibility 0s linear 0s;}
.tabbar{position:fixed;left:12px;right:12px;bottom:12px;height:56px;background:#CF4E1A;color:#fff;border-radius:28px;display:flex;align-items:center;justify-content:center;z-index:100}
#out{position:fixed;top:60px;left:12px;right:12px;z-index:900;background:#000;color:#0f0;font:14px ui-monospace;padding:8px;white-space:pre}
button{font-size:20px;padding:14px 18px;margin:8px}
input{font-size:20px;padding:10px;margin:8px;width:60%}
.page{padding:200px 12px 2000px}
</style></head><body>
<div id="out"></div>
<div class="page"><button id="openBtn">Open sheet</button><p>page body, scroll me</p></div>
<div class="overlay" id="detailOverlay"><div style="padding:220px 12px">
  <input id="f" inputmode="decimal" placeholder="load"><br>
  <button id="closeBtn">Close sheet</button>
</div></div>
<nav class="tabbar">TAB BAR</nav>
<script>
var MODE = location.search.indexOf('after') >= 0 ? 'after' : 'before';
var o = document.getElementById('detailOverlay'), log = [];
document.getElementById('openBtn').onclick = function(){ o.classList.add('open'); };
document.getElementById('closeBtn').onclick = function(){ o.classList.remove('open'); log.push('closed'); };
document.addEventListener('focusout', function(){ log.push('focusout'); });
if (location.search.indexOf('auto') >= 0) document.getElementById('f').addEventListener('focus', function(){ setTimeout(function(){ o.classList.remove('open'); log.push('closed-by-app'); }, 4000); });
if (location.search.indexOf('remove') >= 0) document.getElementById('f').addEventListener('focus', function(){ setTimeout(function(){ var f = document.getElementById('f'); if (MODE === 'after') { f.blur(); log.push('blurred'); } f.parentNode.removeChild(f); o.classList.remove('open'); log.push('removed-by-app'); }, 4000); });
if (MODE === 'after') {
  new MutationObserver(function(recs){
    for (var i = 0; i < recs.length; i++) {
      var r = recs[i], t = r.target;
      if (/(^|\s)open(\s|$)/.test(r.oldValue || '') && !t.classList.contains('open')) {
        var a = document.activeElement;
        if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && t.contains(a)) { a.blur(); log.push('blurred'); }
      }
    }
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['class'], attributeOldValue: true, subtree: true });
}
setInterval(function(){
  var a = document.activeElement, vv = window.visualViewport;
  document.getElementById('out').textContent = MODE + '\nactive: ' + (a ? a.tagName + (a.id ? '#' + a.id : '') : 'none') +
    '\nvv.height: ' + (vv ? Math.round(vv.height) : '-') + '  inner: ' + innerHeight +
    '\nsheet open: ' + o.classList.contains('open') + '\nlog: ' + log.join(' ');
}, 150);
</script></body></html>
