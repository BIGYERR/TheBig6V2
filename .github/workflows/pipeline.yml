# The pipeline. main is what GitHub Pages serves and what Heroku deploys. Work is committed and pushed to dev, and every
# push to dev runs the full suite here; nothing waits for it. Mario reviews the results, then opens a pull request from
# dev into main by hand to release (no agent ever opens one). Branch protection lets main change only through that pull
# request, and only when every check below passes on it.
#
#   push to dev                every check: the full gate suite with its row check and blast radius, fuzz, sabotage,
#                              app and backend tests and lint, and the Docker e2e. A newer push cancels the running one.
#   pull request dev -> main   the same checks again, plus "PR source is dev". All must pass to merge.
#   push to main (the merge)   the deploy proof: Pages built that commit and the live URL serves it.
#   workflow_dispatch          run the checks by hand on any branch.
#
# Every job keeps its run log (temp/, tools/runlog.mjs) as an artifact, so a red check can be read the same way as a
# local one: summary.txt, events.log, output.log and artifacts/ per run.
name: pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The gates were written and their tables computed on Mario's Mac, in New York time.
  TZ: America/New_York
  NODE_VERSION: '26'

jobs:
  source:
    name: PR source is dev
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Only dev merges into main
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$HEAD" != "dev" ]; then
            echo "::error::A pull request into main must come from dev; this one comes from '$HEAD'. Merge it into dev first."
            exit 1
          fi
          echo "from dev: ok"

  app-backend:
    name: app and backend
    if: github.event_name != 'push' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Let Chrome use its sandbox (Ubuntu 24 blocks unprivileged user namespaces through AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: app (type check, unit and integration tests, lint)
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run lint
      - name: backend (tests, lint)
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run lint
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-backend-run-log
          path: temp/
          retention-days: 30

  gates:
    name: gate suite
    if: github.event_name != 'push' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Doctrine text (NRC and NSW copyright, never in the repo; restored from the DOCTRINE_TXZ secret)
        env:
          DOCTRINE_TXZ: ${{ secrets.DOCTRINE_TXZ }}
        run: |
          if [ -z "$DOCTRINE_TXZ" ]; then echo "::error::The DOCTRINE_TXZ secret is not set, so the gates that read doctrine/*.txt cannot run."; exit 1; fi
          printf '%s' "$DOCTRINE_TXZ" | base64 -d | tar -xJf -
          echo "doctrine files: $(ls doctrine/*.txt | wc -l)"
      - name: Baseline (the previous version, as tagged)
        run: |
          set -euo pipefail
          N=$(grep -oE 'name="ia-version" content="[0-9]+"' index.html | grep -oE '[0-9]+')
          git show "V$((N - 1)):index.html" > "$RUNNER_TEMP/base.html"
          echo "BASE=$RUNNER_TEMP/base.html" >> "$GITHUB_ENV"
          echo "candidate ia-version $N, baseline V$((N - 1))"
      - name: gate.sh (every gate, the row check, the blast radius)
        # ROW_RULED: the build's row licence, when the candidate's version has one. ROW_MANIFEST_OUT: this run's row
        # manifest, kept in the run log artifact; gatekeeper regenerates tests/row_manifest.txt from it (CLAUDE.md).
        run: |
          N=$(grep -oE 'name="ia-version" content="[0-9]+"' index.html | grep -oE '[0-9]+')
          LICENCE="tests/measure/v${N}_rulings/v${N}_row_ruled.txt"
          if [ -f "$LICENCE" ]; then export ROW_RULED="$LICENCE"; echo "row licence: $LICENCE"; fi
          mkdir -p temp
          export ROW_MANIFEST_OUT="$GITHUB_WORKSPACE/temp/row_manifest.txt"
          bash -c 'set -eo pipefail; bash tests/gate.sh index.html "$BASE"'
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-run-log
          path: temp/
          retention-days: 30

  fuzz:
    name: fuzz
    if: github.event_name != 'push' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Doctrine text (NRC and NSW copyright, never in the repo; restored from the DOCTRINE_TXZ secret)
        env:
          DOCTRINE_TXZ: ${{ secrets.DOCTRINE_TXZ }}
        run: |
          if [ -z "$DOCTRINE_TXZ" ]; then echo "::error::The DOCTRINE_TXZ secret is not set, so the gates that read doctrine/*.txt cannot run."; exit 1; fi
          printf '%s' "$DOCTRINE_TXZ" | base64 -d | tar -xJf -
          echo "doctrine files: $(ls doctrine/*.txt | wc -l)"
      - name: Baseline (the previous version, as tagged)
        run: |
          set -euo pipefail
          N=$(grep -oE 'name="ia-version" content="[0-9]+"' index.html | grep -oE '[0-9]+')
          git show "V$((N - 1)):index.html" > "$RUNNER_TEMP/base.html"
          echo "BASE=$RUNNER_TEMP/base.html" >> "$GITHUB_ENV"
      - name: Identity fuzz
        run: bash -c 'set -eo pipefail; bash tests/fuzz.sh index.html "$BASE"'
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-run-log
          path: temp/
          retention-days: 30

  sabotage:
    name: sabotage
    if: github.event_name != 'push' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Doctrine text (NRC and NSW copyright, never in the repo; restored from the DOCTRINE_TXZ secret)
        env:
          DOCTRINE_TXZ: ${{ secrets.DOCTRINE_TXZ }}
        run: |
          if [ -z "$DOCTRINE_TXZ" ]; then echo "::error::The DOCTRINE_TXZ secret is not set, so the gates that read doctrine/*.txt cannot run."; exit 1; fi
          printf '%s' "$DOCTRINE_TXZ" | base64 -d | tar -xJf -
          echo "doctrine files: $(ls doctrine/*.txt | wc -l)"
      - name: Every mutation's anchor still applies
        run: python3 tests/sabotage.py --anchors-only index.html
      - name: Trip the proof set (mutations of the specs and gates changed since main)
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          # The dry run exits 1 on an empty set, so its output is read, not its exit code.
          IA_NO_RUNLOG=1 python3 tests/sabotage.py --proof-set "$BASE_REF" index.html --dry > "$RUNNER_TEMP/proofset.txt" 2>&1 || true
          grep -E '^PROOF SET' "$RUNNER_TEMP/proofset.txt" || true
          if grep -q '^PROOF SET 0 mutations' "$RUNNER_TEMP/proofset.txt"; then
            echo "No spec added, no gate edited and no backstop gate named since $BASE_REF: no mutation to trip."
          else
            python3 tests/sabotage.py --proof-set "$BASE_REF" index.html
          fi
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sabotage-run-log
          path: temp/
          retention-days: 30

  e2e:
    name: e2e
    if: github.event_name != 'push' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Docker e2e (every journey, 0% parity against the original)
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run e2e
      - name: Keep the report, the collage and the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: temp/
          retention-days: 30

  deployed:
    name: deploy proof (Pages)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Pages built this commit and the live URL serves it
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/deploy-check.mjs
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-run-log
          path: temp/
          retention-days: 30
