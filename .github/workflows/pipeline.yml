# The pipeline. main is what GitHub Pages serves and what Heroku deploys. Work is committed and pushed to dev, and every
# push to dev runs the full suite here; nothing waits for it. Mario reviews the results, then opens a pull request from
# dev into main by hand to release (no agent ever opens one). Branch protection lets main change only through that pull
# request, and only when every check below passes on it.
#
#   push to dev                every check: the page builds from its sources (dist-github-pages/, and the root
#                              index.html is that build while Pages serves the branch), the type check and the unit,
#                              integration and sweep tests (tests/unit, tests/integration, tests/sweeps), the app's,
#                              the frontends' and the backend's tests, type checks and lint, and the Docker e2e. A newer push cancels the running one.
#   pull request dev -> main   the same checks again, plus "PR source is dev". All must pass to merge.
#   push to main (the merge)   Pages: dist-github-pages/ is built from the sources and, once the Pages source is "GitHub
#                              Actions" (Mario's setting, handoff §12), deployed; then the deploy proof: Pages has that
#                              commit and the live URL serves it; then TestFlight: the release signed and uploaded, so
#                              the phone's TestFlight app offers it (skipped while Mario's secrets are unset).
#   workflow_dispatch          run the checks by hand on any branch; on main, TestFlight runs too (the first upload
#                              needs no merge).
#
# Every job keeps its run log (temp/, tools/runlog.mjs) as an artifact, so a red check can be read the same way as a
# local one: summary.txt, events.log, output.log and artifacts/ per run.
name: pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The feature tests' hand tables and golden files were computed on Mario's Mac, in New York time.
  TZ: America/New_York
  NODE_VERSION: '26'

jobs:
  source:
    name: PR source is dev
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Only dev merges into main
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$HEAD" != "dev" ]; then
            echo "::error::A pull request into main must come from dev; this one comes from '$HEAD'. Merge it into dev first."
            exit 1
          fi
          echo "from dev: ok"

  tests:
    name: unit and integration tests
    if: github.event_name != 'push' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    # 25, not 15 (Mario, Post-v0.245.0): the suite runs about 8 minutes, and a slow runner took every file 1.7 to 2.2
    # times longer and cut a run with no failing test at 15 (run 40200902811, attempt 1).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Doctrine text (NRC and NSW copyright, never in the repo; restored from the DOCTRINE_TXZ secret)
        env:
          DOCTRINE_TXZ: ${{ secrets.DOCTRINE_TXZ }}
        run: |
          if [ -z "$DOCTRINE_TXZ" ]; then echo "::error::The DOCTRINE_TXZ secret is not set, so the tests that read doctrine/*.txt cannot run."; exit 1; fi
          printf '%s' "$DOCTRINE_TXZ" | base64 -d | tar -xJf -
          echo "doctrine files: $(ls doctrine/*.txt | wc -l)"
      - name: Build dist-github-pages/ from frontends/app/src/legacy/src (the page every test boots; frontends/app/scripts/build-index.mjs)
        run: node --input-type=module -e "(await import('./frontends/app/scripts/build-index.mjs')).writePages()"
      - name: The root index.html is that build, byte for byte (the copy Pages serves while its source is the branch main)
        run: node frontends/app/scripts/build-index.mjs --check
      - name: The page boots and builds HALF_MANNY, self-stable (tests/harness.js)
        run: node tests/harness.js dist-github-pages/index.html
      - name: Let Chrome use its sandbox (Ubuntu 24 blocks unprivileged user namespaces through AppArmor; the e2e's own tests draw in Chrome)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: npm ci in tests/ (Vitest, TypeScript, @ia/core, Puppeteer and its Chrome)
        working-directory: tests
        run: npm ci --no-audit --no-fund
      - name: Type check (core, tests)
        working-directory: tests
        run: npm run typecheck
      - name: Vitest over tests/unit tests/integration tests/sweeps (the page against tests/snapshots)
        working-directory: tests
        run: node ../tools/run.mjs tests -- npx vitest run unit integration sweeps
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-run-log
          path: temp/
          retention-days: 30

  app-backend:
    name: app and backend
    if: github.event_name != 'push' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Let Chrome use its sandbox (Ubuntu 24 blocks unprivileged user namespaces through AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: app (type check, unit and integration tests, lint)
        working-directory: frontends/app
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run lint
      - name: frontends (the website and the admin; type check, lint, build)
        working-directory: frontends
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run build
      - name: backend (tests, lint)
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run lint
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-backend-run-log
          path: temp/
          retention-days: 30

  e2e:
    name: e2e
    if: github.event_name != 'push' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Docker e2e (every journey, 0% parity against the original)
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          npm run e2e
      - name: Keep the report, the collage and the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: temp/
          retention-days: 30

  # The native app's compile proof: the Angular app, the Cordova iOS platform and an unsigned Xcode build for the
  # simulator, on a macOS runner (the 60-second check cannot build iOS; the app lane only holds config.xml's version to
  # the page's). Nothing is booted, installed or signed; the signed release is TestFlight's, after a merge into main.
  native:
    name: native (iOS simulator)
    if: github.event_name != 'push' || github.ref == 'refs/heads/dev'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Xcode and the iOS simulator runtimes this runner carries
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS
      - name: The app builds for the iOS simulator (frontends/app/scripts/ios.mjs build; Cordova and Xcode, unsigned, nothing launched)
        working-directory: frontends/app
        run: |
          npm ci --no-audit --no-fund
          npm run build-ios
      - name: Keep the Xcode log and the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-run-log
          path: temp/
          retention-days: 30

  pages:
    name: Pages (dist-github-pages)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build dist-github-pages/ from frontends/app/src/legacy/src (the page and its icon, nothing else)
        run: node --input-type=module -e "(await import('./frontends/app/scripts/build-index.mjs')).writePages()"
      - name: The Pages source ("workflow" deploys from here; "legacy" still serves the branch main's root index.html)
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "type=$(gh api repos/${{ github.repository }}/pages --jq .build_type)" >> "$GITHUB_OUTPUT"
      - name: Upload dist-github-pages/
        if: steps.source.outputs.type == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-github-pages
      - name: Deploy it
        id: deploy
        if: steps.source.outputs.type == 'workflow'
        uses: actions/deploy-pages@v4

  deployed:
    name: deploy proof (Pages)
    needs: pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Pages built this commit and the live URL serves it
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/deploy-check.mjs
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-run-log
          path: temp/
          retention-days: 30

  # TestFlight (handoff §12, the native lane): after the deploy proof, the release goes up to App Store Connect and the
  # phone's TestFlight app offers it. Plain signing (Mario, Post-v0.251.1): one Apple Distribution certificate and the
  # App Store profiles of the app and its RestTimerWidget extension, made once by Mario, plus his App Store Connect API
  # key, all seven as repo secrets (frontends/app/README.md, TestFlight from CI). After the deploy proof, but a lagging
  # Pages does not hold the phone back. Three jobs, so the macOS runner is used only for the archive:
  #   gate        skips cleanly (green) while any secret is unset, or when App Store Connect already holds config.xml's
  #               build: a version goes up once, a fix is the next PATCH (CLAUDE.md, Native)
  #   upload      the signing files from the secrets, then scripts/ios.mjs release: archive and upload
  #   processed   waits until App Store Connect has processed the build. Its notice ("testflight 0.251.1 processed") is
  #               rhythm step 7's TestFlight leg (node frontends/app/scripts/testflight.mjs leg).
  testflight-gate:
    name: TestFlight (gate)
    needs: deployed
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      upload: ${{ steps.gate.outputs.upload }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Upload only with every secret set and a version App Store Connect does not hold yet
        id: gate
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          # Whether each secret is set, never its value: this job reads App Store Connect, it signs nothing.
          HAS_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
          HAS_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID != '' }}
          HAS_ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 != '' }}
          HAS_IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 != '' }}
          HAS_IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD != '' }}
          HAS_IOS_PROFILE_APP: ${{ secrets.IOS_PROFILE_APP != '' }}
          HAS_IOS_PROFILE_WIDGET: ${{ secrets.IOS_PROFILE_WIDGET != '' }}
        run: node frontends/app/scripts/testflight.mjs gate

  testflight:
    name: TestFlight (upload)
    needs: testflight-gate
    if: ${{ !cancelled() && needs.testflight-gate.outputs.upload == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Xcode on this runner
        run: xcodebuild -version
      - name: The signing files from the secrets (a keychain of this run's own, the two App Store profiles, the API key)
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE_APP: ${{ secrets.IOS_PROFILE_APP }}
          IOS_PROFILE_WIDGET: ${{ secrets.IOS_PROFILE_WIDGET }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -eo pipefail
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          decode() { printf '%s' "$1" | tr -d ' \r\n' | base64 --decode > "$2"; }
          decode "$IOS_DIST_CERT_P12" "$dir/distribution.p12"
          decode "$IOS_PROFILE_APP" "$dir/app.mobileprovision"
          decode "$IOS_PROFILE_WIDGET" "$dir/widget.mobileprovision"
          printf '%s\n' "$ASC_KEY_P8" > "$dir/AuthKey.p8"
          keychain="$dir/signing.keychain-db"
          pass="$(openssl rand -base64 24)"
          echo "::add-mask::$pass"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$dir/distribution.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$dir/distribution.p12"
          {
            echo "IOS_KEYCHAIN=$keychain"
            echo "IOS_PROFILES=$dir/app.mobileprovision,$dir/widget.mobileprovision"
            echo "ASC_KEY_PATH=$dir/AuthKey.p8"
          } >> "$GITHUB_ENV"
      - name: Archive the release and upload it to App Store Connect (frontends/app/scripts/ios.mjs release)
        working-directory: frontends/app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          npm ci --no-audit --no-fund
          npm run release-ios
      - name: Remove the signing files
        if: always()
        run: |
          if [ -n "$IOS_KEYCHAIN" ]; then security delete-keychain "$IOS_KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/signing"
      - name: Keep the Xcode logs and the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-run-log
          path: temp/
          retention-days: 30

  testflight-processed:
    name: TestFlight (processed)
    needs: testflight
    if: ${{ !cancelled() && needs.testflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: App Store Connect has processed the build (TestFlight offers it from then on)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: node frontends/app/scripts/testflight.mjs wait
