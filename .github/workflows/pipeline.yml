# The pipeline. main is what GitHub Pages serves and what Heroku deploys. Work is committed and pushed to dev, and every
# push to dev runs the full suite here; nothing waits for it. Mario reviews the results, then opens a pull request from
# dev into main by hand to release (no agent ever opens one). Branch protection lets main change only through that pull
# request, and only when every check below passes on it.
#
#   push to dev                every check: index.html is the build of its sources, the type check and the unit,
#                              integration and sweep tests (tests/unit, tests/integration, tests/sweeps), the app and
#                              backend tests and lint, and the Docker e2e. A newer push cancels the running one.
#   pull request dev -> main   the same checks again, plus "PR source is dev". All must pass to merge.
#   push to main (the merge)   the deploy proof: Pages built that commit and the live URL serves it.
#   workflow_dispatch          run the checks by hand on any branch.
#
# Every job keeps its run log (temp/, tools/runlog.mjs) as an artifact, so a red check can be read the same way as a
# local one: summary.txt, events.log, output.log and artifacts/ per run.
name: pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The feature tests' hand tables and golden files were computed on Mario's Mac, in New York time.
  TZ: America/New_York
  NODE_VERSION: '26'

jobs:
  source:
    name: PR source is dev
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Only dev merges into main
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$HEAD" != "dev" ]; then
            echo "::error::A pull request into main must come from dev; this one comes from '$HEAD'. Merge it into dev first."
            exit 1
          fi
          echo "from dev: ok"

  tests:
    name: unit and integration tests
    if: github.event_name != 'push' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Doctrine text (NRC and NSW copyright, never in the repo; restored from the DOCTRINE_TXZ secret)
        env:
          DOCTRINE_TXZ: ${{ secrets.DOCTRINE_TXZ }}
        run: |
          if [ -z "$DOCTRINE_TXZ" ]; then echo "::error::The DOCTRINE_TXZ secret is not set, so the tests that read doctrine/*.txt cannot run."; exit 1; fi
          printf '%s' "$DOCTRINE_TXZ" | base64 -d | tar -xJf -
          echo "doctrine files: $(ls doctrine/*.txt | wc -l)"
      - name: index.html is the build of frontends/app/src/legacy/src (byte for byte; frontends/app/scripts/build-index.mjs)
        run: node frontends/app/scripts/build-index.mjs --check
      - name: index.html boots and builds HALF_MANNY, self-stable (tests/harness.js)
        run: node tests/harness.js index.html
      - name: npm ci in tests/ (Vitest, TypeScript, @ia/core)
        working-directory: tests
        run: npm ci --no-audit --no-fund
      - name: Type check (core, tests)
        working-directory: tests
        run: npm run typecheck
      - name: Vitest over tests/unit tests/integration tests/sweeps (index.html against tests/snapshots)
        working-directory: tests
        run: node ../tools/run.mjs tests -- npx vitest run unit integration sweeps
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-run-log
          path: temp/
          retention-days: 30

  app-backend:
    name: app and backend
    if: github.event_name != 'push' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Let Chrome use its sandbox (Ubuntu 24 blocks unprivileged user namespaces through AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: app (type check, unit and integration tests, lint)
        working-directory: frontends/app
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run lint
      - name: backend (tests, lint)
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run lint
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-backend-run-log
          path: temp/
          retention-days: 30

  e2e:
    name: e2e
    if: github.event_name != 'push' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Docker e2e (every journey, 0% parity against the original)
        working-directory: frontends/app
        run: |
          npm ci --no-audit --no-fund
          npm run e2e
      - name: Keep the report, the collage and the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: temp/
          retention-days: 30

  deployed:
    name: deploy proof (Pages)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Pages built this commit and the live URL serves it
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/deploy-check.mjs
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-run-log
          path: temp/
          retention-days: 30
